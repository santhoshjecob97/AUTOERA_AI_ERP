name: AutoEra AI ERP Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, staging, develop, pilot ]
  pull_request:
    branches: [ main, staging, pilot ]

jobs:
  backend-quality-and-security:
    name: Backend Tests & Security Scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autoera_test_db
          POSTGRES_USER: autoera_user
          POSTGRES_PASSWORD: test_secure_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django System Check
        run: |
          cd backend
          python manage.py check --deploy

      - name: Verify Migrations
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Run Backend Security & Tenant Isolation Tests
        run: |
          cd backend
          python manage.py test core --noinput

  frontend-quality-and-build:
    name: Frontend Typecheck, Tests & Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run Vitest Suite
        run: npx vitest run --passWithNoTests

      - name: Build Production Bundle (vite build)
        run: npm run build

  container-security-build:
    name: Container Build & Verification
    needs: [ backend-quality-and-security, frontend-quality-and-build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: autoera-backend:latest
