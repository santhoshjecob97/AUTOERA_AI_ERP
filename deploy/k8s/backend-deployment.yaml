apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoera-backend-api
  namespace: autoera-production
  labels:
    app.kubernetes.io/name: autoera-backend-api
    app.kubernetes.io/part-of: autoera-platform
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: autoera-backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoera-backend-api
        app.kubernetes.io/part-of: autoera-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/v1/metrics"
    spec:
      serviceAccountName: autoera-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/autoera-backend:v1.0.0
          imagePullPolicy: IfNotPresent
          command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "4", "--threads", "2", "--timeout", "60", "config.wsgi:application"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: autoera-config
            - secretRef:
                name: autoera-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health/live/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: logs-volume
              mountPath: /app/logs
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: logs-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: autoera-backend-service
  namespace: autoera-production
  labels:
    app.kubernetes.io/name: autoera-backend-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: autoera-backend-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: autoera-backend-hpa
  namespace: autoera-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: autoera-backend-api
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: autoera-backend-pdb
  namespace: autoera-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: autoera-backend-api
