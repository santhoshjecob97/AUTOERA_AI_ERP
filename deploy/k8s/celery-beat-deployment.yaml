apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoera-celery-beat
  namespace: autoera-production
  labels:
    app.kubernetes.io/name: autoera-celery-beat
spec:
  replicas: 1  # Singleton to avoid duplicate scheduled task emissions
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: autoera-celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoera-celery-beat
    spec:
      serviceAccountName: autoera-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: beat
          image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/autoera-backend:v1.0.0
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "config", "beat", "--loglevel=info", "--pidfile=/tmp/celerybeat.pid"]
          envFrom:
            - configMapRef:
                name: autoera-config
            - secretRef:
                name: autoera-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
