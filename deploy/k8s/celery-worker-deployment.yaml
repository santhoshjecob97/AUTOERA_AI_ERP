apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoera-celery-worker
  namespace: autoera-production
  labels:
    app.kubernetes.io/name: autoera-celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: autoera-celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoera-celery-worker
    spec:
      serviceAccountName: autoera-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: worker
          image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/autoera-backend:v1.0.0
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=4", "-Q", "default,telemetry,high_priority"]
          envFrom:
            - configMapRef:
                name: autoera-config
            - secretRef:
                name: autoera-secrets
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
