apiVersion: v1
kind: ConfigMap
metadata:
  name: autoera-config
  namespace: autoera-production
  labels:
    app.kubernetes.io/name: autoera-ai-erp
    app.kubernetes.io/part-of: autoera-platform
data:
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "api.autoera.ai,erp.autoera.ai,localhost"
  DB_ENGINE: "django.db.backends.postgresql"
  DB_NAME: "autoera_production_db"
  DB_PORT: "5432"
  KAFKA_BOOTSTRAP_SERVERS: "b-1.autoera-msk.xyz.c4.kafka.ap-south-1.amazonaws.com:9092,b-2.autoera-msk.xyz.c4.kafka.ap-south-1.amazonaws.com:9092"
  REDIS_URL: "rediss://autoera-redis-cluster.xyz.cache.amazonaws.com:6379/2"
  CELERY_BROKER_URL: "rediss://autoera-redis-cluster.xyz.cache.amazonaws.com:6379/0"
  CELERY_RESULT_BACKEND: "rediss://autoera-redis-cluster.xyz.cache.amazonaws.com:6379/1"
  DD_ENV: "production"
  DD_SERVICE: "autoera-backend-api"
  DD_VERSION: "1.0.0"
  DD_AGENT_HOST: "datadog-agent.datadog.svc.cluster.local"
  DD_TRACE_ENABLED: "true"
  DEFAULT_FROM_EMAIL: "noreply@autoera.ai"
